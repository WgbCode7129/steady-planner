<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Steady Planner: a free planner for Year 1 hall residents. Load radar, if-then chunk planning, a 9:30 pm sleep guardrail and a weekly check-in.">
<meta name="theme-color" content="#1E3A8A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Steady Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap">
<style>
/* Layout: one phone-width column, sticky week header, bottom tab bar. Steady@Hall deck palette: hall navy, cream paper, sage green. */
:root{
  --bg:#F6EBCF; --card:#FFF9E8; --line:#E0CF9F; --ink:#2F2E2B; --muted:#6B6659;
  --navy:#1E3A8A; --navy-2:#2B4BA3; --blue:#4263BD; --sage:#A9C98F; --sage-ink:#46663A; --sage-soft:#E3EED9;
  --red:#B8423F; --red-soft:#F6D5D2; --amber:#E8B04B; --amber-soft:#F8E7C2; --on-navy:#F6EBCF; --on-navy-2:#C9D3F0;
  --display:"Anton","Impact","Arial Narrow",sans-serif; --body:"Montserrat","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101A33; --card:#18264A; --line:#2D3F6E; --ink:#EDE6D3; --muted:#A9B2C9;
  --navy:#C9D3F0; --navy-2:#24376B; --blue:#8FA6EA; --sage:#A9C98F; --sage-ink:#B9D6A0; --sage-soft:#22382A;
  --red:#F08C86; --red-soft:#4A2526; --amber:#E8B04B; --amber-soft:#43361A; --on-navy:#F6EBCF; --on-navy-2:#C9D3F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101A33; --card:#18264A; --line:#2D3F6E; --ink:#EDE6D3; --muted:#A9B2C9;
  --navy:#C9D3F0; --navy-2:#24376B; --blue:#8FA6EA; --sage:#A9C98F; --sage-ink:#B9D6A0; --sage-soft:#22382A;
  --red:#F08C86; --red-soft:#4A2526; --amber:#E8B04B; --amber-soft:#43361A; --on-navy:#F6EBCF; --on-navy-2:#C9D3F0; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1E3A8A}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#1E3A8A;color:#F6EBCF;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:528px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cols{display:flex;flex-direction:column;gap:12px}
.brand{font-family:var(--display);font-size:26px;letter-spacing:.5px;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;letter-spacing:1.5px;color:#A9C98F;font-weight:700;margin-top:4px;text-transform:uppercase}
.wk{text-align:right;font-size:12px;color:#C9D3F0}
.wk b{display:block;font-family:var(--display);font-size:22px;color:#F6EBCF;font-weight:400;letter-spacing:.5px}
h2{font-family:var(--display);font-weight:400;font-size:28px;color:var(--navy);margin:8px 0 4px;letter-spacing:.3px;text-wrap:balance}
.kick{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--sage-ink)}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card.navy{background:var(--navy-2);border-color:var(--blue);color:var(--on-navy)}
.card.navy .kick{color:var(--sage)}
.card.sage{background:var(--sage-soft);border-color:var(--sage)}
.card.amber{background:var(--amber-soft);border-color:var(--amber)}
.card.red{background:var(--red-soft);border-color:var(--red)}
.ifthen{font-size:17px;font-weight:600;line-height:1.35;margin:6px 0 10px}
.ifthen em{font-style:normal;font-weight:800;color:var(--sage)}
.card:not(.navy) .ifthen em{color:var(--navy)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
button,.btn{font:inherit;font-weight:700;font-size:13px;border-radius:999px;border:1.5px solid var(--blue);background:transparent;color:var(--blue);padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:36px}
button.solid,.btn.solid{background:var(--blue);color:#fff}
.card.navy button,.card.navy .btn{border-color:var(--on-navy-2);color:var(--on-navy)}
.card.navy button.solid{background:var(--sage);border-color:var(--sage);color:#1F2A1A}
button.ghost{border-color:transparent;padding-inline:6px}
button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.pill.green{background:var(--sage);color:#1F2A1A}.pill.amber{background:var(--amber);color:#2F2E2B}.pill.red{background:var(--red);color:#fff}.pill.navy{background:var(--blue);color:#fff}
.muted{color:var(--muted)} .small{font-size:12.5px}
.example{font-size:12px;background:var(--amber-soft);border:1px dashed var(--amber);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
ul.chunks{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
ul.chunks li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
ul.chunks li.late .when{color:var(--red);font-weight:700}
ul.chunks li.done .t{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;border-radius:7px;border:2px solid var(--sage-ink);background:transparent;padding:0;min-height:0;display:grid;place-items:center;color:#fff}
.check.on{background:var(--sage-ink)}
.t{font-weight:600;min-width:0}
.when{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.edit{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg);border-radius:10px;padding:10px}
label{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%}
.radar svg{width:100%;height:auto;display:block}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(32px,1fr));gap:5px}
.seg button{border-radius:10px;padding:8px 0;justify-content:center;border-color:var(--line);color:var(--ink);font-variant-numeric:tabular-nums}
.seg button.on{background:var(--navy-2);border-color:var(--navy-2);color:#F6EBCF}
:root[data-theme="dark"] .seg button.on{background:var(--blue);border-color:var(--blue);color:#101A33}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:var(--blue);border-color:var(--blue);color:#101A33}}
.q{display:flex;flex-direction:column;gap:6px}
.q b{font-size:14px}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.lines{display:flex;flex-direction:column;gap:6px;font-size:14px}
.lines span{user-select:all;font-weight:700;font-variant-numeric:tabular-nums}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:560px}
nav.tabs button{border:none;border-radius:10px;flex-direction:column;gap:2px;color:var(--muted);font-size:11.5px;padding:6px 0;min-height:48px;justify-content:center}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--navy);background:var(--bg)}
.dl{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.dl:first-child{border-top:none}
.dl .d{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:#1E3A8A;color:#F6EBCF;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.flexlist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:2px}
.flexlist li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.flexlist li:first-child{border-top:none}
.save{font-size:11px;color:#C9D3F0;margin-top:3px}
details summary{cursor:pointer;font-weight:700;color:var(--blue);font-size:13px}
@media (prefers-reduced-motion: no-preference){.card{transition:background .2s}}
/* Phones: 16px inputs stop iOS zooming on focus. */
@media (max-width:599px){input,select{font-size:16px}}
@media (hover:hover){button:hover,.btn:hover{filter:brightness(1.08)}nav.tabs button:not(.on):hover{background:var(--bg);color:var(--ink)}}
/* Laptops: sidebar nav, wider page, two content columns. */
@media (min-width:900px){
  .top-in{max-width:1088px}
  .brand{font-size:30px}
  .app{max-width:1120px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;padding-block:28px 48px;align-items:start}
  nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);background:none;border:none;padding:0}
  nav.tabs .in{display:flex;flex-direction:column;gap:4px;max-width:none}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:10px 14px;min-height:44px}
  nav.tabs button.on{background:var(--card);box-shadow:inset 3px 0 0 var(--navy)}
  h2{font-size:34px}
  .stack{gap:16px}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  .toast{bottom:28px}
}
</style>

</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">STEADY<small>Steady@Hall planner</small></div>
  <div class="wk" id="wk"><b>Week –</b><span>loading</span><div class="save" id="saveState"></div></div>
</div></header>
<div class="app" id="app">
  <nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
  <main id="view" aria-live="polite"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="html")e.innerHTML=v;else e.setAttribute(k,v===true?"":v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const mins=t=>{const[a,b]=t.split(":").map(Number);return a*60+b;};
const hm=m=>pad(Math.floor(m/60)%24)+":"+pad(m%60);
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate=s=>{const d=parse(s);return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];};
const fmtTime=t=>{let m=mins(t),hh=Math.floor(m/60),mm=m%60,ap=hh>=12?"pm":"am";hh=hh%12||12;return hh+(mm?":"+pad(mm):"")+" "+ap;};
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes();};
// Two columns on laptops; on phones they stack, main first.
const cols=(main,side)=>h("div",{class:"cols"},h("div",{class:"stack"},...main.filter(Boolean)),h("div",{class:"stack"},...side.filter(Boolean)));
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200);}

/* ---------- templates ---------- */
const TEMPLATES={
  essay:["Read the brief|20","Write the outline|45","Draft part 1|60","Draft part 2|60","Add references|30","Proofread|30"],
  lab:["Organise the data|30","Write methods and results|60","Write the discussion|60","References and proofread|30"],
  problems:["Skim every question|15","Do the first half|60","Do the second half|60","Check answers|30"],
  slides:["Outline the story|30","Build the slides|60","Rehearse once|30","Final run-through|20"],
  exam:["List every topic|20","Revise topics 1–3|60","Revise topics 4–6|60","Do one past paper|90","Review mistakes|45"]};
const TPL_NAMES={essay:"Essay",lab:"Lab report",problems:"Problem set",slides:"Presentation",exam:"Exam revision"};
const PLACES=["Common room","Library","My desk","Study room"];

/* ---------- state ---------- */
const DEFAULT_SETTINGS={w1:"2026-08-10",recess:8,cutoff:"21:30",sleep:"23:30",crunch:3};
function exampleState(){
  const t=today(),D=n=>ymd(addDays(t,n));
  const dls=[{id:"d1",mod:"SC1003",title:"CA2 essay",due:D(4),tpl:"essay"},{id:"d2",mod:"MH1810",title:"Quiz 2",due:D(5),tpl:"exam"},{id:"d3",mod:"CC0015",title:"Reflection",due:D(6),tpl:"essay"},{id:"d4",mod:"SC1003",title:"Lab report 2",due:D(13),tpl:"lab"},{id:"d5",mod:"MH1810",title:"Final exam",due:D(30),tpl:"exam"}];
  const ch=[["d1","Read the brief",20,-1,"16:00","Common room",true],["d1","Write the outline",45,0,"16:00","Common room",false],["d1","Draft part 1",60,1,"14:00","Library",false],["d1","Draft part 2",60,2,"22:00","My desk",false],["d1","Add references",30,3,"15:00","Library",false],["d2","Revise topics 1–3",60,2,"10:00","Library",false]]
    .map(([dl,title,m,off,time,place,done])=>({id:uid(),dl,title,mins:m,date:D(off),time,place,done}));
  return {v:1,example:true,settings:{...DEFAULT_SETTINGS},deadlines:dls,chunks:ch,checkins:[{id:uid(),date:D(-8),sleep:4,skipped:2,stress:3,connected:4,feeling:"okay",tier:"green"},{id:uid(),date:D(-1),sleep:3,skipped:3,stress:4,connected:3,feeling:"struggling",tier:"amber"}],flex:{}};
}
let S=null, store={kind:"none"};
const LS="steady-planner-v1";

async function loadState(){
  // Try the viewer's private Claude account storage first; fall back to this device.
  try{
    const db=await (window.claude&&window.claude.use?window.claude.use("db"):null);
    const user=await (window.claude&&window.claude.use?window.claude.use("user"):null);
    const id=user?await user.id():null;
    if(db&&id){
      const ref=db.doc("data/users/"+id+"/planner");
      const snap=await ref.get();
      if(snap.exists&&snap.data().state){store={kind:"account",ref};return JSON.parse(snap.data().state);}
      store={kind:"account",ref,fresh:true};
    }
  }catch(e){store={kind:"none"};}
  try{const raw=localStorage.getItem(LS);if(raw){if(store.kind!=="account")store={kind:"device"};return JSON.parse(raw);}}catch(e){}
  if(store.kind!=="account")store={kind:"device"};
  return null;
}
let saveTimer=null,saving=false,pending=false;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);}
async function flush(){
  if(saving){pending=true;return;}
  saving=true;const json=JSON.stringify(S);
  try{localStorage.setItem(LS,json);}catch(e){}
  if(store.kind==="account"){
    try{await store.ref.set({state:json,updated:Date.now()});}
    catch(e){store={kind:"device"};}
  }
  saving=false;showSave();
  if(pending){pending=false;flush();}
}
function showSave(){$("#saveState").textContent=store.kind==="account"?"Saved to your account":"Saved on this device";}

/* ---------- semester maths ---------- */
function calWeek(dateStr){return Math.floor((parse(dateStr)-parse(S.settings.w1))/864e5/7)+1;}
function teachWeek(dateStr){const n=calWeek(dateStr),r=Number(S.settings.recess);if(n<1)return{label:"Before W1",n:0};if(n===r)return{label:"Recess",n:-1};const t=n>r?n-1:n;if(t>13)return{label:"Finals",n:14};return{label:"Week "+t,n:t};}
const endMin=c=>mins(c.time)+Number(c.mins);
const isLate=c=>endMin(c)>mins(S.settings.cutoff)||mins(c.time)<300;
const dlOf=id=>S.deadlines.find(d=>d.id===id);
function sortedChunks(){return [...S.chunks].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));}
function nextSlot(fromDate){ // next day at 4 pm, the Co-Study default
  return {date:ymd(addDays(parse(fromDate),1)),time:"16:00"};}
function tierOf(c){if(c.feeling==="notok")return"red";if(c.feeling==="struggling"||c.sleep<=3||c.skipped>=3||c.stress>=5||c.connected<=1)return"amber";return"green";}
function weekKey(d){const x=parse(d);const day=(x.getDay()+6)%7;return ymd(addDays(x,-day));}

/* ---------- views ---------- */
let tab="today",openEdit=null,chunkFor=null,draft={sleep:null,skipped:null,stress:null,connected:null,feeling:null},lastResult=null;
const ICONS={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 radar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M9.3 20V4M14.6 20v-7M20 20V8"/></svg>',
 plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
 checkin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z"/></svg>'};
function renderTabs(){const T=[["today","Today"],["radar","Radar"],["plan","Plan"],["checkin","Check-in"]];const box=$("#tabs");box.replaceChildren(...T.map(([k,l])=>{const b=h("button",{class:tab===k?"on":null,"aria-current":tab===k?"page":null,onclick:()=>{tab=k;render();window.scrollTo(0,0);}});b.innerHTML=ICONS[k];b.append(l);return b;}));}
function header(){const w=teachWeek(ymd(today()));const d=today();$("#wk").firstElementChild.textContent=w.label;$("#wk").children[1].textContent=DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];showSave();}
function exampleBanner(){return S.example?h("div",{class:"example"},h("span",null,"You’re looking at an example semester."),h("button",{onclick:()=>{S={v:1,example:false,settings:{...S.settings},deadlines:[],chunks:[],checkins:[],flex:{}};save();tab="plan";render();toast("Cleared. Add your first deadline.");}},"Start my own")):null;}
